 if(S.app==="msg"&&S.chat===k){const ms=$(".msgs");ms.querySelectorAll(".st").forEach(x=>x.remove());ms.appendChild(bub(r,m,pv));stat(k)}}
function tp(k,on){if(S.chat!==k)return;const ms=$(".msgs");if(!ms)return;ms.querySelectorAll(".st,.tp").forEach(x=>x.remove());if(on){ms.appendChild(el("div","tp","<i></i><i></i><i></i>"));ms.scrollTop=ms.scrollHeight}}
/* ===== KEYBOARD ===== */
function kb(c){const rows=["qwertyuiop","asdfghjkl","^zxcvbnm<"];
 c.innerHTML=rows.map((r,i)=>`<div class="kr"${i==1?' style="padding:0 18px"':""}>${[...r].map(ch=>ch==="^"?`<div class="k s" data-k="sh">${SH}</div>`:ch==="<"?`<div class="k s" data-k="del">${DEL}</div>`:`<div class="k" data-k="${ch}">${ch}</div>`).join("")}</div>`).join("")+'<div class="kr"><div class="k s" data-k=",">,</div><div class="k sp" data-k="sp">spasi</div><div class="k s" data-k=".">.</div><div class="k s go" data-k="go">kirim</div></div>';
 c.querySelectorAll(".k").forEach(k=>k.addEventListener("pointerdown",e=>{e.preventDefault();press(k.dataset.k)}))}
function lit(ch){const kk=ch===" "?"sp":String(ch).toLowerCase(),e=[...document.querySelectorAll(".k")].find(x=>x.dataset.k===kk);if(e){e.classList.add("on");setTimeout(()=>e.classList.remove("on"),110)}}
function inp(){const t=$("#ti");if(t)t.textContent=S.buf.slice(-34)}
function press(k){if(S.chat==null)return;if(k==="sh"){S.sh=!S.sh;lit("sh");sfx("type");return}lit(k);
 if(k==="del"){S.buf=S.buf.slice(0,-1);sfx("del")}else if(k==="go"){sendMine();return}
 else{S.buf+=k==="sp"?" ":S.sh?k.toUpperCase():k;S.sh=0;sfx(k==="sp"?"space":"type")}inp()}
function sendMine(){const x=S.buf.trim();if(!x)return;sfx("send");vib(15);const k=S.chat;S.buf="";inp();add(k,{w:"me",x})}
async function typeMe(k,text,id){S.buf="";inp();
 for(const p of text.split(/(\^\d+)/)){if(id!==RUN)return;
  if(/^\^\d+$/.test(p)){await sleep(450);for(let i=0;i<+p.slice(1);i++){S.buf=S.buf.slice(0,-1);sfx("del");lit("del");inp();await sleep(90)}await sleep(250)}
  else for(const ch of p){S.buf+=ch;lit(ch);sfx(ch===" "?"space":"type");inp();await sleep(55+Math.random()*95)}}
 await sleep(350);lit("go");sfx("send");vib(15);const x=S.buf;S.buf="";inp();add(k,{w:"me",x})}
/* ===== NOTIFIKASI ===== */
let bt=0;
function notify(k,who,o){if(!S.notif)return;const r=R[k],pre=r.g&&CFG.sp[who]?CFG.sp[who][0]+": ":"",n={room:k,t:r.n,x:pre+(o.x||(o.k==="i"?"Foto":"Lokasi"))};
 if(S.locked){S.lockN.unshift(n);S.lockN=S.lockN.slice(0,4);renderLock()}
 else{const b=$("#ban");b.innerHTML=avh(k,40)+`<div><b>${esc(n.t)}</b><span>${esc(n.x)}</span></div>`;hyd(b);b.onclick=()=>{b.classList.remove("on");openChatRoom(k)};b.classList.add("on");$("#di").classList.add("pulse");setTimeout(()=>$("#di").classList.remove("pulse"),1600);clearTimeout(bt);bt=setTimeout(()=>b.classList.remove("on"),3800)}}
/* ===== TELEPON MASUK / KELUAR ===== */
const XI='<svg viewBox="0 0 60 60"><path fill="#fff" d="M12 20l6 2 2 8-4 3c2 5 6 9 11 11l3-4 8 2 2 6c0 5-4 8-9 8-14 0-30-16-30-28z" transform="scale(.8) translate(10 8)"/></svg>';
const cw=(n,st,b)=>`<div class="cw"><div class="cn1">${esc(n)}</div><div class="cs" id="cst">${st}</div>${b}</div>`;
async function call(k,name,lines,id){const c=$("#call");let ok=0;
 while(!ok){c.innerHTML=cw(name,"panggilan masuk",`<div class="cbs"><div class="cb rd" id="cx">${XI}<span>Tolak</span></div><div class="cb gr" id="ca">${XI}<span>Terima</span></div></div>`);
  c.classList.add("on");sfx("ring");vib([300,150,300]);const iv=setInterval(()=>{sfx("ring");vib([300,150,300])},2300);
  const r=await new Promise(res=>{S.cres=res;$("#cx").onclick=()=>res("no");$("#ca").onclick=()=>res("ok")});
  clearInterval(iv);if(id!==RUN||r==="abort"){c.classList.remove("on");return}
  if(r==="ok")ok=1;else{c.classList.remove("on");await sleep(5000);if(id!==RUN)return}}
 c.innerHTML=cw(name,"00:00",`<div class="sub" id="sub"></div><div class="cbs"><div class="cb rd" id="ce">${XI}<span>Akhiri</span></div></div>`);
 let s=0;const tm=setInterval(()=>{s++;const e=$("#cst");if(e)e.textContent=mm(s)},1000);S.cend=0;$("#ce").onclick=()=>{S.cend=1};
 for(const L of lines){if(id!==RUN||S.cend)break;const i=L.indexOf(":"),who=L.slice(0,i)==="a"?"Alya":name.split(" ")[0],sub=$("#sub");sub.appendChild(el("p","",`<b>${esc(who)}</b>${esc(L.slice(i+1))}`));await sleep(1600+L.length*42)}
 clearInterval(tm);c.classList.remove("on");S.cend=0;if(id!==RUN)return;
 add(k,{k:"s",x:"Panggilan suara, "+mm(Math.max(s,1))});CFG.recents.unshift([name,"Hari ini","in"]);sfx("recv");await sleep(500)}
async function outCall(n){const c=$("#call");if(c.classList.contains("on"))return;let e=0;c.innerHTML=cw(n,"memanggil...",`<div class="cbs"><div class="cb rd" id="ce">${XI}<span>Akhiri</span></div></div>`);c.classList.add("on");$("#ce").onclick=()=>e=1;
 for(let i=0;i<20&&!e;i++)await sleep(100);if(!e){const s=$("#cst");if(s)s.textContent="terhubung";sfx("recv");for(let i=0;i<25&&!e;i++)await sleep(100)}c.classList.remove("on")}
/* ===== MESIN CERITA ===== */
const parse=e=>{const m=e.match(/^(?:(\d+)>)?(\w+)\|(\w+): ?([\s\S]*)$/);return{d:m[1]?+m[1]:900,r:m[2],w:m[3],x:m[4]}};
const fin=t=>{let s="";t.split(/(\^\d+)/).forEach(p=>{s=/^\^\d+$/.test(p)?s.slice(0,-(+p.slice(1))||undefined):s+p});return s};
function ff(e){if(e[0]==="#")return;if(e[0]==="@"){const p=e.slice(1).split("|"),t=p[0];
  if(t==="name")R[p[1]].n=p[2];else if(t==="set")doSet({[p[1]]:p[2]});else if(t==="call"){push(p[1],{k:"s",x:"Panggilan suara, 02:40"});CFG.recents.unshift([p[2],"Hari ini","in"])}
  else if(t==="img")push(p[1],{w:p[2],k:"i",key:p[3],l:p[4]});else if(t==="loc")push(p[1],{w:p[2],k:"l",l:p[3]});return}
 const m=parse(e);push(m.r,{w:m.w,x:m.w==="me"?fin(m.x):m.x})}
async function waitOpen(k,id){while(!(S.app==="msg"&&S.chat===k&&!S.locked)){await sleep(350);if(id!==RUN)return false}return true}
async function say(k,who,o,id){
 if(who==="me"){if(!await waitOpen(k,id))return;if(o.x!==undefined)await typeMe(k,o.x,id);else add(k,Object.assign({w:"me"},o));return}
 const open=S.app==="msg"&&S.chat===k;
 if(open){tp(k,1);await sleep(Math.min(500+(o.x||"").length*30,2400));tp(k,0);if(id!==RUN)return}
 add(k,Object.assign({w:who},o));
 if(open)sfx("recv");else{R[k].un++;badge();sfx("notif");vib([120,60,120]);notify(k,who,o);refresh()}}
async function step(e,id){if(e[0]==="#")return;
 if(e[0]==="@"){const p=e.slice(1).split("|"),t=p[0];
  if(t==="name"){R[p[1]].n=p[2];refresh();return}
  if(t==="end"){await sleep(2500);if(id!==RUN)return;const nm=p[1]||"BERSAMBUNG";S.seen.add(nm.split(":")[0]);$("#end>div").innerHTML=nm+`<br><small style="opacity:.6">Ending ditemukan: ${S.seen.size}/5</small>`;$("#end").classList.add("on");return}
  if(t==="set"){doSet({[p[1]]:p[2]});return}if(t==="go")return p[1];if(t==="if")return new Function("F","return "+p[1])(F)?p[2]:void 0;if(t==="choice")return choose(id,p[1]);
  await sleep(1200);if(id!==RUN)return;
  if(t==="call")return call(p[1],p[2],p[3].split(";"),id);
  if(t==="img")return say(p[1],p[2],{k:"i",key:p[3],l:p[4]},id);
  if(t==="loc")return say(p[1],p[2],{k:"l",l:p[3]},id);return}
 const m=parse(e);await sleep(m.d);if(id!==RUN)return;await say(m.r,m.w,{x:m.x},id)}
async function play(from){const id=RUN;let L=CFG.story,i=from;while(i<L.length){if(id!==RUN)return;const j=await step(L[i],id);if(id!==RUN)return;if(typeof j==="string"){L=CFG.seg[j]||[];i=0}else i++}}
const doSet=o=>{for(const k in o){const v=o[k];F[k]=typeof v==="string"&&/^[+-]\d+$/.test(v)?(F[k]||0)+ +v:(isNaN(v)?v:+v)}};
function drawCh(){const c=S.pc,b=S.mb&&S.mb.querySelector(".kb");if(!c||!b||S.chat!==c.room)return;b.innerHTML='<div class="sys" style="margin:0">Pilih jawaban Alya</div>';b.style.overflow="auto";
 c.o.forEach(o=>{const d=el("div","cp",`<div class="rn">${esc(o.t)}</div>`);d.style.margin="0 8px";d.onclick=()=>{S.pc=null;b.style.overflow="";kb(b);c.res(o)};b.appendChild(d)})}
async function choose(id,cid){const c=CFG.ch[cid],k=c.room,o0=c.o.filter(o=>!o.if||new Function("F","return "+o.if)(F));
 if(!(S.app==="msg"&&S.chat===k&&!S.locked)){notify(k,"sys",{x:"Alya harus mengambil keputusan"});sfx("notif")}
 if(!await waitOpen(k,id))return;const o=await new Promise(res=>{S.pc={room:k,o:o0,res};drawCh()});
 if(id!==RUN)return;F.picks.push(o.id);doSet(o.set||{});await say(k,"me",{x:o.x},id);return o.go}
function reset(){F={picks:[]};S.pc=null;for(const k in CFG.rooms)R[k]={n:CFG.rooms[k].n,g:CFG.rooms[k].g,vis:0,un:0,m:[],ts:0,rd:1};
 S.lockN=[];S.pend=null;S.buf="";S.locked=1;S.cend=0;closeApp(1);$("#home").classList.remove("in");["#call","#end","#pass","#wpk"].forEach(s=>$(s).classList.remove("on"));$("#ban").classList.remove("on");$("#lock").classList.remove("up");renderLock();badge()}
function start(idx){RUN++;if(S.cres)S.cres("abort");reset();for(let i=0;i<idx;i++)ff(CFG.story[i]);badge();play(idx)}
$("#rs").onclick=()=>start(0);
{const b=el("div","btn","Coba Jalur Lain");b.style.background="rgba(255,255,255,.18)";b.onclick=()=>start(CFG.story.findIndex(e=>e==="#cp|Titik Keputusan"));$("#end").appendChild(b)}
/* ===== ISI APLIKASI ===== */
const row=(l,r,cl)=>`<div class="row"${cl?` style="${cl}"`:""}>${l}</div>`;
const APPS={
 msg(b){S.mb=b;msgList()},
 phone(b){let tab=0,dial="";const L={2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"};
  const draw=()=>{b.innerHTML=`<div class="hd">Telepon</div><div class="tabs"><span class="${tab?"":"a"}" data-t="0">Terbaru</span><span class="${tab?"a":""}" data-t="1">Keypad</span></div><div class="ls" id="pb"></div>`;
   b.querySelectorAll(".tabs span").forEach(s=>s.onclick=()=>{tab=+s.dataset.t;draw()});const p=b.querySelector("#pb");
   if(!tab)CFG.recents.forEach(([n,w,t])=>{const r=el("div","row",`<div class="rt"><div class="rn" style="color:${t==="miss"?"#ff3b30":"#000"}">${esc(n)}</div><div class="rp">${t==="miss"?"Tidak terjawab":t==="out"?"Keluar":"Masuk"}</div></div><span style="color:#8e8e93">${w}</span>`);r.onclick=()=>outCall(n);p.appendChild(r)});
   else{p.style.cssText="display:flex;flex-direction:column;align-items:center";p.innerHTML=`<div style="font-size:34px;height:56px;margin-top:10px" id="dn">${dial}</div><div class="pk" style="display:none"></div><div id="kp" style="display:grid;grid-template-columns:repeat(3,78px);gap:14px 22px;color:#000"></div>`;
    const kp=p.querySelector("#kp");[1,2,3,4,5,6,7,8,9,"*",0,"#"].forEach(n=>{const k=el("div","pk",`${n}<small>${L[n]||""}</small>`);k.style.cssText="background:#e9e9eb;color:#000";k.onclick=()=>{dial+=n;sfx("type");p.querySelector("#dn").textContent=dial};kp.appendChild(k)});
    const g=el("div","pk",XI);g.style.cssText="background:#34c759;grid-column:2";g.onclick=()=>{if(dial)outCall(dial)};kp.appendChild(g);
    const d=el("div","pk",DEL);d.style.cssText="background:none;font-size:20px";d.onclick=()=>{dial=dial.slice(0,-1);p.querySelector("#dn").textContent=dial};kp.appendChild(d)}};draw()},
 notes(b){const list=()=>{b.innerHTML='<div class="hd big">Catatan</div><div class="ls"></div>';CFG.notes.forEach(([t,x])=>{const r=el("div","row",`<div class="rt"><div class="rn">${esc(t)}</div><div class="rp">${esc(x.replace(/\n/g," "))}</div></div>`);r.onclick=()=>det(t,x);b.querySelector(".ls").appendChild(r)})};
  const det=(t,x)=>{b.innerHTML=`<div class="ch"><div class="back">Catatan</div></div><div class="ls nd"><h2>${esc(t)}</h2><p>${esc(x).replace(/\n/g,"<br>")}</p></div>`;b.querySelector(".back").onclick=list};list()},
 photos(b){const grid=()=>{b.innerHTML='<div class="hd big">Pustaka</div><div class="ls pg"></div>';CFG.photos.forEach((p,i)=>{const d=el("div","tl");paint(d,p);d.onclick=()=>view(i);b.querySelector(".pg").appendChild(d)})};
  const view=i=>{const n=CFG.photos.length;b.innerHTML=`<div class="ch"><div class="back">Pustaka</div><div class="cn">${i+1} dari ${n}</div></div><div class="pv"></div><div class="pbar"><span id="pp">Sebelumnya</span><span id="pw">Jadikan Wallpaper</span><span id="pn">Berikutnya</span></div>`;
   const pv=b.querySelector(".pv");paint(pv,CFG.photos[i]);let x0=0;pv.addEventListener("pointerdown",e=>x0=e.clientX);pv.addEventListener("pointerup",e=>{const d=e.clientX-x0;if(d>50)view((i+n-1)%n);else if(d<-50)view((i+1)%n)});
   b.querySelector(".back").onclick=grid;b.querySelector("#pp").onclick=()=>view((i+n-1)%n);b.querySelector("#pn").onclick=()=>view((i+1)%n);b.querySelector("#pw").onclick=e=>{setWp(CFG.photos[i]);e.target.textContent="Wallpaper diganti"}};grid()},
 cal(b){let g="<i></i><i></i><i></i>";for(let d=1;d<=31;d++)g+=`<b class="${d===14?"td":""}">${d}${[15,18,21,25].includes(d)?"<u></u>":""}</b>`;
  b.innerHTML=`<div class="hd big" style="color:#ff3b30">Juli 2026</div><div class="cg">${["M","S","S","R","K","J","S"].map(x=>`<em>${x}</em>`).join("")}${g}</div><div class="hd" style="text-align:left;margin-top:10px">Selasa, 14 Juli</div><div class="ls ev"></div>`;
  CFG.events.forEach(([t,n,c])=>b.querySelector(".ev").appendChild(el("div","row",`<i style="background:${c}"></i><div class="rt"><div class="rn">${esc(n)}</div><div class="rp">${t}</div></div>`)))},
 maps(b){let sel=0;const draw=()=>{b.innerHTML=`<svg viewBox="0 0 393 330" style="width:100%;flex:none"><rect width="393" height="330" fill="#e8f0e0"/><path d="M0 250L393 150M180 0L230 330M0 60L393 40" stroke="#fff" stroke-width="14" fill="none"/><path d="M300 0L393 120" stroke="#a9d3f5" stroke-width="30"/>${CFG.places.map((p,i)=>`<g transform="translate(${p[1]} ${p[2]}) scale(${i===sel?1.4:1})"><path d="M0 0a12 12 0 1 0-1 0z" transform="translate(0 -30) scale(1.1)"/><path d="M0 0l-9-20a11 11 0 1 1 18 0z" fill="#ff3b30"/><circle cy="-23" r="4" fill="#fff"/></g>`).join("")}</svg><div class="ls"></div>`;
  CFG.places.forEach((p,i)=>{const r=el("div","row",`<div class="rt"><div class="rn">${p[0]}</div><div class="rp">${p[3]}</div></div>`);if(i===sel)r.style.background="#f2f2f7";r.onclick=()=>{sel=i;draw()};b.querySelector(".ls").appendChild(r)})};draw()},
 set(b){const sw=(k,v)=>`<div class="sw ${v?"on":""}" data-k="${k}"></div>`,it=(c,n,r)=>`<div class="row" style="cursor:default"><div class="si" style="background:${c}"></div><div class="rt">${n}</div>${r||""}</div>`;
  b.innerHTML=`<div class="hd">Pengaturan</div><div class="set"><div class="grp"><div class="row" style="cursor:default">${avh("alya",58)}<div class="rt"><div class="rn" style="font-size:20px">Alya Pramesti</div><div class="rp">Apple ID, iCloud, Media</div></div></div></div>
  <div class="grp">${it("#0a84ff","Wi-Fi",sw("w",1))}${it("#0a84ff","Bluetooth",sw("b",1))}</div>
  <div class="grp">${it("#ff3b30","Notifikasi",sw("n",S.notif))}${it("#ff2d55","Suara",sw("s",S.snd))}${it("#5856d6","Fokus",sw("f",0))}<div class="row" id="wl">${`<div class="si" style="background:#34aadc"></div><div class="rt">Wallpaper</div><span style="color:#8e8e93">&rsaquo;</span>`}</div></div></div>`;hyd(b);
  b.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{s.classList.toggle("on");const on=s.classList.contains("on");if(s.dataset.k==="n")S.notif=on?1:0;if(s.dataset.k==="s")S.snd=on?1:0});b.querySelector("#wl").onclick=pick},
 safari(b){b.innerHTML='<div class="hd big">Checkpoint</div><div class="ls"></div>';CFG.story.forEach((e,i)=>{if(e.startsWith("#cp|")){const c=el("div","cp",`<div class="rn">${esc(e.slice(4))}</div><div class="rp">Mulai ulang cerita dari sini</div>`);c.onclick=()=>start(i);b.querySelector(".ls").appendChild(c)}})}
};

buildHome();setWp(CFG.wall[0]);tick();
$("#w1").innerHTML='<div class="wi"><div><h4>Jakarta <svg viewBox="0 0 24 24" width="11" fill="#fff"><path d="M3 11l18-8-8 18-2-8z"/></svg></h4><div class="t">29\u00b0</div></div><div><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="5.5" fill="#ffd60a"/><circle cx="13" cy="13" r="9.3" fill="none" stroke="#ffd60a" stroke-width="2.4" stroke-dasharray="2 4.15"/></svg><h4 style="margin-top:6px">Cerah</h4><small>T:31\u00b0 R:24\u00b0</small></div></div>';
$("#w2").innerHTML='<b class="mh">Juli</b><div class="mc">'+["M","S","S","R","K","J","S"].map(x=>"<b>"+x+"</b>").join("")+"<i></i><i></i><i></i>"+[...Array(31)].map((_,k)=>`<span class="${k===13?"td":""}">${k+1}</span>`).join("")+"</div>";
