async function step(e,id){if(e[0]==="#")return;
 if(e[0]==="@"){const p=e.slice(1).split("|"),t=p[0];

  if(t==="set"){doSet({[p[1]]:p[2]});return}if(t==="go")return p[1];if(t==="if")return new Function("F","return "+p[1])(F)?p[2]:void 0;if(t==="choice")return choose(id,p[1]);
