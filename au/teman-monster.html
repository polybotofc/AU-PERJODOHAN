let AC;function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tn(f,d,ty,v,t0,f2){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(t0||0);o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
const SYN={type:()=>tn(1800,.03,"square",.04),send:()=>{tn(700,.12,"sine",.15,0,1400)},recv:()=>{tn(1046,.18,"sine",.15);tn(1318,.3,"sine",.12,.1)},notif:()=>{tn(1568,.15,"triangle",.18);tn(1174,.25,"triangle",.15,.12)}};
const SND={};
function sfx(n){if(!S.snd)return;const u=CFG.sfx[n];if(u){try{const b=SND[n]||(SND[n]=new Audio(u)),a=b.cloneNode();a.volume=CFG.sfxVol;const r=a.play();if(r&&r.catch)r.catch(()=>SYN[n]&&SYN[n]())}catch(e){SYN[n]&&SYN[n]()}}else SYN[n]&&SYN[n]()}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
/* ===== STATE ===== */
const R={},S={locked:1,chat:null,buf:"",lockN:[],pend:null,snd:1,fear:0,clk:"11:41"};
let RUN=0,TS=0,FT=[];
function setClk(t){S.clk=t;$("#ck").textContent=t;$("#lc").textContent=t}
function setFear(n){S.fear=n;$("#vig").style.opacity=Math.min(.8,n*.15);FT.forEach(clearInterval);FT=[];
 if(n>=3)FT.push(setInterval(()=>{if(Math.random()<.4){const p=$("#phone");p.classList.add("fl");setTimeout(()=>p.classList.remove("fl"),90+Math.random()*180)}},2600));
 if(n>=4)FT.push(setInterval(()=>{if(S.snd){tn(55,.2,"sine",.5);tn(48,.22,"sine",.45,.22)}},1100))}
function fit(){const p=$("#phone"),m=innerWidth<=500;p.classList.toggle("mob",m);if(m){p.style.transform="";return}p.style.transform="translate(-50%,-50%) scale("+Math.min(innerWidth/413,innerHeight/872,1.3)+")"}
addEventListener("resize",fit);fit();document.addEventListener("pointerdown",()=>ctx(),{once:true});
paintWp();function paintWp(){loadImg("wallpaper").then(u=>{if(u)$("#lock .wp").style.backgroundImage='url("'+u+'")'})}
/* ===== LOCK & PASSCODE ===== */
function renderLock(){const n=$("#ln");n.innerHTML="";S.lockN.forEach(x=>{const d=el("div","nt",avr(x.room,40)+`<div class="tt"><b>${esc(x.t)}</b><span>${esc(x.x)}</span></div>`);d.dataset.r=x.room;n.appendChild(d)});hyd(n)}
let pin="";
const dots=()=>$("#dots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?"f":""}"></i>`).join("");
function showPass(){pin="";dots();$("#pass").classList.add("on")}
function pkey(n){sfx("type");pin+=n;dots();if(pin.length===4){if(pin===CFG.pass)setTimeout(unlock,180);else{vib([60,40,60]);const d=$("#dots");d.classList.add("sh");setTimeout(()=>{d.classList.remove("sh");pin="";dots()},420)}}}
function unlock(){S.locked=0;$("#pass").classList.remove("on");$("#lock").classList.add("up");S.lockN=[];renderLock();msgList();if(S.pend){const r=S.pend;S.pend=null;setTimeout(()=>showChat(r),250)}}
$("#hint").textContent=CFG.hint;
{const L={2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"},p=$("#pad");[1,2,3,4,5,6,7,8,9,"",0].forEach(n=>{const k=el("div","pk"+(n===""?" z":""),n===""?"":`${n}<small>${L[n]||""}</small>`);if(n!=="")k.onclick=()=>pkey(n);p.appendChild(k)})}
$("#cancel").onclick=()=>{$("#pass").classList.remove("on");S.pend=null};
$("#lock").addEventListener("click",e=>{const n=e.target.closest(".nt");S.pend=n?n.dataset.r:null;showPass()});
$("#hz").onclick=()=>{if(S.locked){if(!$("#pass").classList.contains("on"))showPass()}else if(S.chat)msgList()};
/* ===== PESAN ===== */
const prev=l=>!l?"":l.k==="i"?"Foto":l.x;
function msgList(){S.chat=null;const b=$("#app");b.innerHTML='<div class="hd">Pesan</div><div class="ls"></div>';const ls=b.querySelector(".ls");
 Object.keys(R).filter(k=>R[k].vis).sort((a,c)=>R[c].ts-R[a].ts).forEach(k=>{const r=R[k],l=r.m.filter(m=>m.k!=="s").pop(),row=el("div","row",avr(k,48)+`<div class="rt"><div class="rn">${esc(r.n)}</div><div class="rp">${esc(prev(l))}</div></div>${r.un?'<i class="dot"></i>':""}`);row.onclick=()=>showChat(k);ls.appendChild(row)});
 if(!ls.children.length)ls.innerHTML='<div style="padding:16px 20px;color:#8e8e93">Belum ada percakapan.</div>';hyd(ls)}
function bub(r,m,pv){if(m.k==="s")return el("div","sys",esc(m.x));const me=m.w==="me",row=el("div","rw "+(me?"mr":"or"));
 if(!me&&r.g)row.innerHTML=avh(m.w,30);
 const d=el("div","mw "+(me?"me":"ot")+(me&&m.x&&m.x[0]==="*"?" th":"")+(m.w==="cic"?" gl":""));let h="";
 if(r.g&&!me&&CFG.sp[m.w]&&(!pv||pv.w!==m.w))h+=`<div class="sn" style="color:${CFG.sp[m.w][1]}">${esc(CFG.sp[m.w][0])}</div>`;
 if(m.q)h+=`<div class="qt"><b>Anda</b>${esc(m.q)}</div>`;
 h+=m.k==="i"?`<div class="im"></div>`+(m.l?esc(m.l):""):`<span class="tx">${esc(m.x)}</span>`;
 h+=`<i class="tm">${m.t}${me?" ✓✓":""}</i>`;d.innerHTML=h;row.appendChild(d);
 if(m.k==="i")loadImg(m.key).then(u=>{if(u)d.querySelector(".im").style.backgroundImage='url("'+u+'")'});hyd(row);return row}
function showChat(k){S.chat=k;const r=R[k],b=$("#app");r.un=0;
 b.innerHTML=`<div class="ch"><div class="back">‹</div>${avr(k,36)}<div><div class="cn">${esc(r.n)}</div><div class="cm">${esc(CFG.rooms[k].s||"online")}</div></div></div><div class="msgs"></div><div class="inp"><div class="ib"><span id="ti"></span><i class="cur"></i></div><div class="sdb"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 14V3M3 7l5-5 5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div></div><div class="kb"></div>`;
 hyd(b);const ms=b.querySelector(".msgs");r.m.forEach((m,i)=>ms.appendChild(bub(r,m,r.m[i-1])));ms.scrollTop=ms.scrollHeight;
 b.querySelector(".back").onclick=msgList;b.querySelector(".sdb").onclick=()=>press("go");kb(b.querySelector(".kb"));inp()}
function add(k,m){const r=R[k],pv=r.m[r.m.length-1];m.t=S.clk;r.m.push(m);r.vis=1;r.ts=++TS;
 if(S.chat===k){const ms=$(".msgs");ms.appendChild(bub(r,m,pv));ms.scrollTop=ms.scrollHeight}else if(!S.chat&&!S.locked)msgList()}
function tp(k,on){if(S.chat!==k)return;const ms=$(".msgs");if(!ms)return;ms.querySelectorAll(".tp").forEach(x=>x.remove());if(on){ms.appendChild(el("div","tp","<i></i><i></i><i></i>"));ms.scrollTop=ms.scrollHeight}}
function kb(c){const rows=["qwertyuiop","asdfghjkl","zxcvbnm"];
 c.innerHTML=rows.map((r,i)=>`<div class="kr"${i==1?' style="padding:0 16px"':""}>${[...r].map(ch=>`<div class="k" data-k="${ch}">${ch}</div>`).join("")}</div>`).join("")+'<div class="kr"><div class="k" data-k="del">⌫</div><div class="k sp" data-k="sp">spasi</div><div class="k go" data-k="go">kirim</div></div>';
 c.querySelectorAll(".k").forEach(k=>k.addEventListener("pointerdown",e=>{e.preventDefault();press(k.dataset.k)}))}
function lit(ch){const kk=ch===" "?"sp":String(ch).toLowerCase(),e=[...document.querySelectorAll(".k")].find(x=>x.dataset.k===kk);if(e){e.classList.add("on");setTimeout(()=>e.classList.remove("on"),110)}}
function inp(){const t=$("#ti");if(t)t.textContent=S.buf.slice(-34)}
function press(k){if(S.chat==null)return;lit(k);if(k==="del"){S.buf=S.buf.slice(0,-1)}else if(k==="go"){const x=S.buf.trim();if(!x)return;sfx("send");S.buf="";inp();add(S.chat,{w:"me",x});return}else S.buf+=k==="sp"?" ":k;sfx("type");inp()}
async function typeMe(k,text,id){S.buf="";inp();for(const ch of [...text]){if(id!==RUN)return;S.buf+=ch;lit(ch);sfx("type");inp();await sleep(40+Math.random()*80)}
 await sleep(300);lit("go");sfx("send");vib(15);S.buf="";inp();add(k,{w:"me",x:text})}
/* ===== NOTIFIKASI ===== */
let bt=0;
function notify(k,who,x){const r=R[k],pre=r.g&&CFG.sp[who]?CFG.sp[who][0]+": ":"",n={room:k,t:r.n,x:pre+x};
 if(S.locked){S.lockN.unshift(n);S.lockN=S.lockN.slice(0,4);renderLock()}
 else{const b=$("#ban");b.innerHTML=avr(k,40)+`<div class="tt"><b>${esc(n.t)}</b><span>${esc(n.x)}</span></div>`;hyd(b);b.onclick=()=>{b.classList.remove("on");showChat(k)};b.classList.add("on");clearTimeout(bt);bt=setTimeout(()=>b.classList.remove("on"),3800)}}
/* ===== MESIN CERITA ===== */
const parse=e=>{const m=e.match(/^(?:(\d+)>)?(\w+)\|(\w+): ?([\s\S]*)$/);return{d:m[1]?+m[1]:900,r:m[2],w:m[3],x:m[4]}};
async function waitOpen(k,id){let n=0;while(!(S.chat===k&&!S.locked)){if(n++%36===0){sfx("notif");vib([100,60,100]);notify(k,"me","Ketuk untuk membalas")}await sleep(350);if(id!==RUN)return false}return true}
async function say(k,who,o,id){
 if(who==="me"){if(!await waitOpen(k,id))return;if(o.k==="i"){await sleep(900);add(k,Object.assign({w:"me"},o))}else await typeMe(k,o.x,id);return}
 const open=S.chat===k&&!S.locked;
 if(open){tp(k,1);await sleep(Math.min(500+(o.x||"").length*28,2400));tp(k,0);if(id!==RUN)return}
 add(k,Object.assign({w:who},o));
 if(open)sfx("recv");else{R[k].un++;sfx("notif");vib([120,60,120]);notify(k,who,o.x||"Foto")}}
async function step(e,id){
 const dm=e.match(/^(\d+)>(@[\s\S]*)$/);if(dm){await sleep(+dm[1]);if(id!==RUN)return;e=dm[2]}
 if(e[0]==="@"){const p=e.slice(1).split("|"),t=p[0];
  if(t==="t"){setClk(p[1]);return}if(t==="fear"){setFear(+p[1]);return}
  if(t==="sys"){await sleep(900);if(id!==RUN)return;add(p[1],{k:"s",x:p[2]});return}
  if(t==="img")return say(p[1],p[2],{k:"i",key:p[3],l:p[4]},id);
  if(t==="end"){await sleep(2500);if(id!==RUN)return;$("#et").innerHTML=esc(p[1])+'<br><small style="opacity:.6">Livly salah kirim ke grup yang ada monsternya</small>';$("#end").classList.add("on")}return}
 const m=parse(e);await sleep(m.d);if(id!==RUN)return;let x=m.x,q=null;const qm=x.match(/^\(q:([^)]*)\)/);if(qm){q=qm[1];x=x.slice(qm[0].length)}
 await say(m.r,m.w,q?{x,q}:{x},id)}
async function play(){const id=RUN,L=CFG.story;for(let i=0;i<L.length;i++){if(id!==RUN)return;await step(L[i],id)}}
function reset(){for(const k in CFG.rooms)R[k]={n:CFG.rooms[k].n,g:CFG.rooms[k].g,vis:0,un:0,m:[],ts:0};
 S.lockN=[];S.pend=null;S.buf="";S.locked=1;S.chat=null;setClk("11:41");setFear(0);$("#app").innerHTML="";["#end","#pass"].forEach(s=>$(s).classList.remove("on"));$("#ban").classList.remove("on");$("#lock").classList.remove("up");renderLock()}
function start(){RUN++;reset();play()}
$("#rs").onclick=start;start();
</script></body></html>
